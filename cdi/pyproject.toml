[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "update-check-runner"
version = "0.1.0"
description = "Local execution foundation for open-source update verification"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "docker>=7.1,<8",
  "sqlalchemy>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "ruff>=0.9,<1"]

[project.scripts]
update-runner = "runner.cli:main"
ossguard = "ossguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

